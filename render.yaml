# Render Blueprint — deploys the Holofolio API + a managed Postgres.
# Push this repo to GitHub, then in the Render dashboard: New > Blueprint,
# point it at the repo, and Render reads this file automatically.
#
# Commands run from the REPO ROOT (not server/) on purpose — this is an npm
# workspaces monorepo, and `npm install` has to run at the root for the
# server's workspace dependency on packages/shared to symlink correctly.
databases:
  - name: holofolio-db
    plan: free
    databaseName: holofolio
    user: holofolio

services:
  - type: web
    name: holofolio-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server:start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: holofolio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Everything below needs a real value pasted into the Render
      # dashboard (Environment tab) after the first deploy — `sync: false`
      # just tells Render not to expect a value in this file (so no secrets
      # end up committed to the repo).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: POKEMONTCG_IO_API_KEY
        sync: false
      - key: JUSTTCG_API_KEY
        sync: false
      - key: EBAY_APP_ID
        sync: false
      - key: EBAY_CERT_ID
        sync: false
      - key: PRICECHARTING_API_TOKEN
        sync: false
      - key: COLLECTR_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL_BASE
        sync: false
